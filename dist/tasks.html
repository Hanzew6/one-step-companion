<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5fc">
  <meta name="description" content="一步：从今天的任务，走向眼前的一小步。">
  <title>一步 · 今天，从这里开始</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='2' y='2' width='36' height='36' rx='12' fill='%236550a5'/%3E%3Cpath d='m12 26 8-12 8 12M16 22h8' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="wardrobe.css">
  <script src="model.js" defer></script>
  <script src="app.js" defer></script>
<script defer src="english.js"></script><script defer src="language.js"></script></head>
<body>
  <a class="skip-link" href="#app">跳到今天的任务</a>
  <header class="mast">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">←</span><span>返回桌宠</span></a>
    <div class="language-picker" role="group" aria-label="Language / 语言"><button type="button" data-language="zh" lang="zh-CN">中文</button><button type="button" data-language="en" lang="en">EN</button></div>
  </header>
  <main class="workspace">
    <section class="app-shell" aria-label="一步应用">
      <div id="app" class="app" tabindex="-1"></div>

    </section>
    <div id="storage-notice" class="storage-notice" role="status" hidden></div>

    <p class="example-note">固定案例演示 · 预写建议 · 未接入 AI</p>
    <details id="demo-tools" class="demo-tools">
      <summary>演示说明与情境控制 <span aria-hidden="true">＋</span></summary>
      <div class="demo-content">
        <p>单页陪伴演示：从列表选任务，开始眼前一步。卡住、休息和继续都留在同一个工作区域。</p>
        <div class="sim-date"><span>演示日期</span><time id="demo-date"></time></div>
        <div class="demo-controls"><button class="demo-action" data-action="tomorrow">模拟明天 →</button><button class="demo-action" data-action="overdue">查看逾期情境 · 11 月 5 日</button></div>
        <button class="reset-button" data-action="ask-reset" aria-expanded="false" aria-controls="reset-confirm">↺ 重置演示</button>
        <p class="demo-explanation">这些控制用于讲解。进度仅保存在当前浏览器。每日时段是演示预设：15 分钟 = 10 分工作 + 5 分缓冲；30 分钟 = 15 + 10 分工作 + 5 分缓冲；60 分钟 = 25 + 25 分工作 + 10 分缓冲。时段不代表整份作业的完成用时。</p>
      </div>
    <div id="reset-confirm" class="inline-panel" hidden><p>重置会清除这个浏览器里的示例进度和便签。</p><button data-action="cancel-reset" class="quiet">保留进度</button> <button data-action="reset" class="quiet">确认重置</button></div></details>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">此演示需要启用 JavaScript，任务进度保存在当前浏览器。</p></noscript>
</body>
</html>
